# Sample proxy vhost. Requires: a2enmod proxy proxy_http
# TLS=no on the daemon. bootstashd ignores X-Forwarded-*.
#
# Pick one PUBLIC_URL. This ServerName must be that host.
# Extra names: a second vhost that only Redirects (not ServerAlias).
#
# A) Cubby hostname — this file
#    PUBLIC_URL=https://bootstash.example.com
#
# B) VPN hostname — Apache must not bind TCP 443 if OpenVPN does.
#    PUBLIC_URL=https://vpn.example.com
#    Use ServerName vpn.example.com, and Redirect extra names there.
#    HAProxy mux: Listen 127.0.0.1:8443, RemoteIPProxyProtocol On.
#    See OPENVPN.md (Sharing TCP 443) and examples/haproxy-local.cfg.
#
# OpenVPN Connect pastes PUBLIC_URL. Origin A/B:
# /usr/share/doc/bootstash/OPENVPN.md
<VirtualHost *:443>
    ServerName bootstash.example.com
    # ServerAlias bs.example.com  # will not work, make a separate vhost
    ServerAdmin admin@example.com

    ProxyPass / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
    ProxyPreserveHost On
    LimitRequestBody 33554432
</VirtualHost>

# Extra name for A. For B, Redirect to https://vpn.example.com/ instead.
<VirtualHost *:443>
    ServerName bs.example.com
    Redirect permanent / https://bootstash.example.com/
</VirtualHost>
