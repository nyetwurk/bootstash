#
# Sample location for a trusted reverse proxy. Not a full vhost.
# Proxy to a local HTTP listen (LISTEN=127.0.0.1:8080 or unix://).
# TLS=no on the daemon. bootstashd ignores X-Forwarded-*.
#
# PUBLIC_URL is this server_name (https://… if TLS).
# Extra names: return 301 to that URL. Do not proxy them.
# OpenVPN Connect pastes PUBLIC_URL. Origin A/B:
# /usr/share/doc/bootstash/OPENVPN.md
# HAProxy mux: listen 127.0.0.1:8443 proxy_protocol
# (Sharing TCP 443).
#
# location / {
#     proxy_pass http://127.0.0.1:8080;
#     proxy_set_header Host $host;
#     client_max_body_size 32m;
# }
#
# Import URLs carry ?token= (a bearer secret). Omit the query string
# for that path. $uri has no query; $request does.
# log_format bootstash_noquery '$remote_addr - $remote_user [$time_local] '
#     '"$request_method $uri $server_protocol" $status $body_bytes_sent';
# location /openvpn-api/profile {
#     access_log /var/log/nginx/access.log bootstash_noquery;
#     proxy_pass http://127.0.0.1:8080;
#     proxy_set_header Host $host;
# }
#
# Extra name (same idea as apache-vhost.conf layout A):
# server {
#     listen 443 ssl;
#     server_name bs.example.com;
#     return 301 https://bootstash.example.com$request_uri;
# }
