#
# Sample location for a trusted reverse proxy. Not a full vhost.
# Proxy to a local HTTP listen (LISTEN=127.0.0.1:8080 or unix://).
# TLS=no on the daemon. bootstashd ignores X-Forwarded-*.
#
# PUBLIC_URL is this server_name (https://… if TLS).
# Extra names: return 301 to that URL. Do not proxy them.
# OpenVPN Connect pastes PUBLIC_URL. Origin A/B:
# /usr/share/doc/bootstash/OPENVPN.md
#
# location / {
#     proxy_pass http://127.0.0.1:8080;
#     proxy_set_header Host $host;
#     client_max_body_size 32m;
# }
#
# Extra name (same idea as apache-vhost.conf layout A):
# server {
#     listen 443 ssl;
#     server_name bs.example.com;
#     return 301 https://bootstash.example.com$request_uri;
# }
