# Sample location for a trusted reverse proxy. Not a full vhost.
# Proxy to a local HTTP listen (for example LISTEN=127.0.0.1:8080 or unix://).
# TLS=no on the daemon. Set PUBLIC_URL to this server_name (https://… if TLS).
# bootstashd does not read X-Forwarded-*.
#
# location / {
#     proxy_pass http://127.0.0.1:8080;
#     proxy_set_header Host $host;
#     client_max_body_size 32m;
# }
#
# Extra DNS name: return 301. Do not proxy. PUBLIC_URL is server_name above.
# server {
#     listen 443 ssl;
#     server_name bs.example.com;
#     return 301 https://bootstash.example.com$request_uri;
# }
