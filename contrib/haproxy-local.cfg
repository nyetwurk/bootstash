#
# Copy to /etc/haproxy/haproxy-local.cfg. Loaded after the stock
# /etc/haproxy/haproxy.cfg (a new defaults resets the HTTP one).
# In /etc/default/haproxy keep CONFIG on the stock file and set:
# EXTRAOPTS="-S /run/haproxy-master.sock -f /etc/haproxy/haproxy-local.cfg"
#
# Pair with OpenVPN TCP on 127.0.0.1:1194 (clients still dial 443).
# Apache: Listen 127.0.0.1:8443 and RemoteIPProxyProtocol On.
# See /usr/share/doc/bootstash/OPENVPN.md (Sharing TCP 443).

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 50s
    timeout server 50s

frontend f443
    bind :443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend https if { req.ssl_hello_type 1 }
    default_backend openvpn

backend https
    server apache 127.0.0.1:8443 send-proxy-v2

backend openvpn
    server ovpn 127.0.0.1:1194
