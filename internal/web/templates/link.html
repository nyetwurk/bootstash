{{define "link"}}
<div class="panel">
<h1>Link your Linux account</h1>
{{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
<form class="stack" method="post" action="/link">
<label>Username
<input type="text" name="username" autocomplete="username" required{{if .Hint}} value="{{.Hint}}"{{end}}>
</label>
<label>Password
<span class="secret">
<input id="password" type="password" name="password" autocomplete="current-password" required>
<button class="reveal" type="button" aria-controls="password" aria-pressed="false" aria-label="Show password">
<svg class="eye" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="eye-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
</button>
</span>
</label>
<button class="btn" type="submit">Link account</button>
</form>
</div>
<script>
(function () {
  var box = document.getElementById("password");
  var btn = document.querySelector(".reveal");
  if (!box || !btn) return;
  btn.addEventListener("click", function () {
    var show = box.type === "password";
    box.type = show ? "text" : "password";
    btn.setAttribute("aria-pressed", show ? "true" : "false");
    btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });
})();
</script>
{{end}}
